site_name: Android Solid Services
site_url: https://androidsolidservices.erfangholami.com
site_description: Single Solid sign-in for the Android ecosystem — SDK and app for accessing Solid pods.
site_author: Erfan Gholami
repo_name: Android-Solid-Services
repo_url: https://github.com/erfangholami/Android-Solid-Services

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Get started:
      - Getting Started: getting-started.md
      - How It Works: concepts.md
  - Integrate:
      - Client Library: client-library.md
      - API Library: api-library.md
      - Solid-OIDC Client ID Document: client-id-document/README.md
  - Architecture: architecture.md
  - More:
      - Troubleshooting: troubleshooting.md
      - Releases: release.md
      - Privacy Policy: privacy.md
  # A tab that leaves the site: it opens the generated Dokka reference directly, rather than a
  # page that merely links to it. `dokkaToDocs` writes it into docs/api before the site builds.
  - API reference: api/index.html

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true
