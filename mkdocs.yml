site_name: Android Solid Services
site_url: https://androidsolidservices.erfangholami.com
site_description: Single Solid sign-in for the Android ecosystem — SDK and app for accessing Solid pods.
site_author: Erfan Gholami
repo_name: Android-Solid-Services
repo_url: https://github.com/erfangholami/Android-Solid-Services

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js

nav:
  - Home: index.md
  - Get Started:
      - Getting Started: getting-started.md
      - How It Works: concepts.md
  - Integrate:
      - Client Library: client-library.md
      - API Library: api-library.md
      - Solid-OIDC Client ID Document: client-id-document/README.md
  - Internals:
      - Architecture: architecture.md
      - The App: app.md
      - Monitoring: monitoring.md
  - Reference:
      - API Reference: api/index.html
      - Releases: release.md
      - Troubleshooting: troubleshooting.md
      - Privacy Policy: privacy.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true
