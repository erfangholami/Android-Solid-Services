name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  # Lets the release workflow gate publishing on a full CI run.
  workflow_call:
    inputs:
      ref:
        description: >-
          Ref to check out. The release workflow passes the tag being published so CI
          validates exactly what ships. Empty means the default ref for the event.
        required: false
        type: string
        default: ''
  workflow_dispatch:

concurrency:
  # Never cancel a run a release is waiting on — only superseded PR pushes.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GRADLE_ARGS: >-
    -Dorg.gradle.java.installations.auto-detect=false
    -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64

jobs:
  # A push to main that carries a release tag is handled by the Release workflow, which runs
  # this same CI on the tag ref — running it here too would just do everything twice. GitHub
  # delivers branch and tag pushes as separate events, so "does this commit have a tag" is
  # answered by asking the remote. Push main and the tag together (git push origin main vX.Y.Z)
  # and the guard is reliable; a tag pushed later merely lets one redundant run through.
  release-push:
    name: Release-push guard
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Check for a release tag on the pushed commit
        id: check
        run: |
          PROCEED=true
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if git ls-remote "https://github.com/${{ github.repository }}" 'refs/tags/v*' | grep -q "^${{ github.sha }}"; then
              echo "Release tag present — the Release workflow runs CI on the tag ref."
              PROCEED=false
            fi
          fi
          echo "proceed=$PROCEED" >> "$GITHUB_OUTPUT"

  style:
    name: Code style
    needs: release-push
    if: needs.release-push.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint (Spotless)
        run: ./gradlew spotlessCheck $GRADLE_ARGS

      - name: detekt
        if: always()
        run: ./gradlew detekt $GRADLE_ARGS

      - name: Collect detekt SARIF
        if: always()
        run: |
          mkdir -p sarif
          for f in $(find . -path '*/build/reports/detekt/detekt.sarif'); do
            cp "$f" "sarif/$(echo "${f#./}" | tr '/' '_')"
          done
          ls -l sarif/ || true

      # Fails for PRs from forks, which are not granted security-events: write.
      - name: Upload detekt SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif
          category: detekt

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/'
          if-no-files-found: ignore

  test:
    name: Unit tests
    needs: release-push
    if: needs.release-push.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: >-
          ./gradlew
          :Shared:testDebugUnitTest
          :api:testDebugUnitTest
          :client:testDebugUnitTest
          :app:testFossDebugUnitTest
          :app:testGmsDebugUnitTest
          $GRADLE_ARGS

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  lint:
    name: Android Lint
    needs: release-push
    if: needs.release-push.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: >-
          ./gradlew
          :Shared:lintDebug
          :api:lintDebug
          :client:lintDebug
          :app:lintFossDebug
          :app:lintGmsDebug
          $GRADLE_ARGS

      - name: Collect Lint SARIF
        if: always()
        run: |
          mkdir -p sarif
          for f in $(find . -path '*/build/reports/lint-results-*.sarif'); do
            cp "$f" "sarif/$(echo "${f#./}" | tr '/' '_')"
          done
          ls -l sarif/ || true

      # Fails for PRs from forks, which are not granted security-events: write.
      - name: Upload Lint SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif
          category: android-lint

      - name: Upload Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: ignore

  build:
    name: Assemble debug
    needs: release-push
    if: needs.release-push.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The release workflow assembles :app, so without this a compile break in the
      # app module would only surface at publish time.
      - name: Assemble
        run: >-
          ./gradlew
          :app:assembleFossDebug
          :app:assembleGmsDebug
          :Shared:assembleDebug
          :api:assembleDebug
          :client:assembleDebug
          $GRADLE_ARGS

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: ignore

      # Catches broken KDoc here rather than when Deploy Docs runs on main.
      - name: Build API reference
        run: ./gradlew dokkaGeneratePublicationHtml $GRADLE_ARGS

  # The client suite drives every SDK call across a real binder into fakes hosted in the test
  # APK's own :fakeass process, so it needs no ASS app, pod or network — just an emulator. It is
  # the only CI coverage of the IPC layer: parcel marshalling, argument order, service-death
  # recovery. ~30 s of test time once the emulator is up.
  instrumented:
    name: Instrumented tests (client IPC)
    needs: release-push
    if: needs.release-push.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Without KVM the emulator falls back to software emulation and the boot alone
      # can blow the job timeout.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: AVD cache
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-34

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot."

      - name: Run client instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :client:connectedDebugAndroidTest $GRADLE_ARGS

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            client/build/reports/androidTests/
            client/build/outputs/androidTest-results/
          if-no-files-found: ignore
