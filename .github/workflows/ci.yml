name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  # Lets the release workflow gate publishing on a full CI run.
  workflow_call:
    inputs:
      ref:
        description: >-
          Ref to check out. The release workflow passes the tag being published so CI
          validates exactly what ships. Empty means the default ref for the event.
        required: false
        type: string
        default: ''
  workflow_dispatch:

concurrency:
  # Never cancel a run a release is waiting on — only superseded PR pushes.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GRADLE_ARGS: >-
    -Dorg.gradle.java.installations.auto-detect=false
    -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64

jobs:
  style:
    name: Code style
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint (Spotless)
        run: ./gradlew spotlessCheck $GRADLE_ARGS

      - name: detekt
        if: always()
        run: ./gradlew detekt $GRADLE_ARGS

      - name: Collect detekt SARIF
        if: always()
        run: |
          mkdir -p sarif
          for f in $(find . -path '*/build/reports/detekt/detekt.sarif'); do
            cp "$f" "sarif/$(echo "${f#./}" | tr '/' '_')"
          done
          ls -l sarif/ || true

      # Fails for PRs from forks, which are not granted security-events: write.
      - name: Upload detekt SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif
          category: detekt

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/'
          if-no-files-found: ignore

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: >-
          ./gradlew
          :Shared:testDebugUnitTest
          :api:testDebugUnitTest
          :client:testDebugUnitTest
          :app:testDebugUnitTest
          $GRADLE_ARGS

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: >-
          ./gradlew
          :Shared:lintDebug
          :api:lintDebug
          :client:lintDebug
          :app:lintDebug
          $GRADLE_ARGS

      - name: Collect Lint SARIF
        if: always()
        run: |
          mkdir -p sarif
          for f in $(find . -path '*/build/reports/lint-results-*.sarif'); do
            cp "$f" "sarif/$(echo "${f#./}" | tr '/' '_')"
          done
          ls -l sarif/ || true

      # Fails for PRs from forks, which are not granted security-events: write.
      - name: Upload Lint SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif
          category: android-lint

      - name: Upload Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: ignore

  build:
    name: Assemble debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The release workflow assembles :app, so without this a compile break in the
      # app module would only surface at publish time.
      - name: Assemble
        run: >-
          ./gradlew
          :app:assembleDebug
          :Shared:assembleDebug
          :api:assembleDebug
          :client:assembleDebug
          $GRADLE_ARGS

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  instrumented:
    name: Instrumented tests
    runs-on: ubuntu-latest
    # ~10-15 min per run; skipped while a PR is still a draft.
    if: github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      matrix:
        api-level: [26]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest $GRADLE_ARGS

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-api${{ matrix.api-level }}
          path: '**/build/reports/androidTests/'
          if-no-files-found: ignore
