name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.3.0)'
        required: true

jobs:
  # Nothing is published unless the full CI suite passes on the exact ref being released.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  release:
    name: Publish Libraries & Release APK
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Refusing to release '$TAG' — expected a version tag such as v0.5.0."; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Run library unit tests
        run: ./gradlew :Shared:testDebugUnitTest :api:testDebugUnitTest :client:testDebugUnitTest -Dorg.gradle.java.installations.auto-detect=false -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64

      - name: Decode keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > ${{ runner.temp }}/release.jks

      - name: Build release APK and library AARs
        run: ./gradlew :app:assembleRelease :Shared:assembleRelease :api:assembleRelease :client:assembleRelease -Dorg.gradle.java.installations.auto-detect=false -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Collect release artifacts
        run: |
          mkdir -p release-artifacts
          cp Shared/build/outputs/aar/Shared-release.aar \
             release-artifacts/Shared-${{ steps.version.outputs.version }}.aar
          cp api/build/outputs/aar/api-release.aar \
             release-artifacts/api-${{ steps.version.outputs.version }}.aar
          cp client/build/outputs/aar/client-release.aar \
             release-artifacts/client-${{ steps.version.outputs.version }}.aar
          cp app/build/outputs/apk/release/app-release.apk \
             release-artifacts/AndroidSolidServices-${{ steps.version.outputs.version }}.apk

      - name: Publish libraries to Maven Central
        run: ./gradlew :Shared:publishAndReleaseToMavenCentral :api:publishAndReleaseToMavenCentral :client:publishAndReleaseToMavenCentral --no-configuration-cache -Dorg.gradle.java.installations.auto-detect=false -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f ${{ runner.temp }}/release.jks
