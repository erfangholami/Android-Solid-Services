{% extends "base.html" %}

<!--
  The announcement bar. Before 1.0 the SDK is source-breaking between minors and the AIDL wire
  protocol changes with it, so a reader arriving on a version-switched page needs to know the
  contract is not frozen yet. `announce.dismiss` remembers a dismissal per visitor.
-->
{% block announce %}
  From 0.8.0 the host app is <a href="https://solidshare.app">Solid Share</a>; the Android Solid
  Services app stopped at 0.7.2. The SDK is pre-1.0, so pin a version and read the
  <a href="{{ 'project/releases/' | url }}">release notes</a> before upgrading.
{% endblock %}
